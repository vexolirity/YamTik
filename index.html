<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TikTok Downloader - Tanpa Watermark & MP3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header {
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            color: white;
            padding: 30px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h1 i {
            font-size: 32px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .format-section {
            padding: 24px 24px 16px;
            background: #f8f9fa;
        }

        .format-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            font-size: 14px;
        }

        .format-options {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .format-card {
            flex: 1;
            min-width: 140px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .format-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
            box-shadow: 0 4px 12px rgba(102,126,234,0.2);
        }

        .format-card.video.active {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.05);
        }

        .format-card.audio.active {
            border-color: #4ecdc4;
            background: rgba(78,205,196,0.05);
        }

        .format-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .format-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .format-desc {
            font-size: 11px;
            color: #888;
        }

        .input-section {
            padding: 0 24px 20px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            display: block;
        }

        .url-input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .download-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 16px;
        }

        .download-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            padding: 0 24px 24px;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 20px;
            margin-top: 16px;
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-preview {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .info-text {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .info-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        .download-item {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .footer {
            padding: 16px;
            text-align: center;
            font-size: 11px;
            color: #aaa;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 24px;
            }
            .format-options {
                flex-direction: column;
            }
            .format-card {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <i>🎵</i> TikTok Downloader
            </h1>
            <p>Download video tanpa watermark & audio MP3 • Gratis</p>
        </div>

        <div class="format-section">
            <div class="format-title">📱 PILIH FORMAT:</div>
            <div class="format-options">
                <div class="format-card video" data-format="video">
                    <div class="format-icon">🎬</div>
                    <div class="format-name">No Watermark</div>
                    <div class="format-desc">MP4 · Tanpa logo</div>
                </div>
                <div class="format-card audio" data-format="audio">
                    <div class="format-icon">🎵</div>
                    <div class="format-name">MP3 Audio</div>
                    <div class="format-desc">Audio saja</div>
                </div>
            </div>
        </div>

        <div class="input-section">
            <label class="input-label">🔗 PASTE URL TIKTOK:</label>
            <input type="text" class="url-input" id="urlInput" placeholder="https://vt.tiktok.com/... atau https://www.tiktok.com/...">
            <button class="download-btn" id="downloadBtn">⬇️ AMBIL</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="error-message" id="errorMessage"></div>
            <div class="result-card" id="resultCard">
                <div id="videoContainer"></div>
                <div class="info-title" id="resultTitle"></div>
                <div class="info-text" id="resultMeta"></div>
                <div class="action-buttons" id="actionButtons"></div>
            </div>
        </div>

        <div class="footer">
            ⚡ Fast Download • No Registration • No Watermark
        </div>
    </div>

    <script src="api.js"></script>
</body>
</html>
