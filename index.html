<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TikTok Downloader - No Watermark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        /* Format Options */
        .format-section {
            margin-bottom: 28px;
        }

        .format-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .format-options {
            display: flex;
            gap: 12px;
        }

        .format-card {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: white;
        }

        .format-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
        }

        .format-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .format-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .format-name {
            font-weight: 700;
            font-size: 14px;
            color: #333;
            margin-bottom: 4px;
        }

        .format-desc {
            font-size: 11px;
            color: #999;
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 6px;
        }

        /* URL Input */
        .url-section {
            margin-bottom: 24px;
        }

        .url-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: block;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #e0e0e0;
            border-radius: 60px;
            padding: 4px 16px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-wrapper i {
            color: #999;
            margin-right: 12px;
        }

        #urlInput {
            flex: 1;
            border: none;
            padding: 16px 0;
            font-size: 14px;
            outline: none;
            background: transparent;
            font-family: monospace;
        }

        /* Button */
        .btn-download {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-download:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 16px;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
            font-size: 13px;
        }

        /* Result */
        .result {
            background: #f5f5f5;
            border-radius: 20px;
            padding: 16px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-content {
            display: flex;
            gap: 16px;
        }

        .result-thumb img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
        }

        .result-info {
            flex: 1;
        }

        .result-title {
            font-weight: 600;
            font-size: 13px;
            color: #333;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-author {
            font-size: 11px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .result-meta {
            font-size: 10px;
            color: #999;
            margin-bottom: 10px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #667eea;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            color: #e53e3e;
            font-size: 13px;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 11px;
            color: #999;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
            }
            
            .format-options {
                flex-direction: column;
            }
            
            .result-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>TIKTOK DOWNLOADER</h1>
            <p>Download video TikTok tanpa watermark. Gratis.</p>
        </div>

        <!-- Format Pilihan -->
        <div class="format-section">
            <div class="format-title">PILIH FORMAT:</div>
            <div class="format-options">
                <div class="format-card active" data-format="video">
                    <div class="format-icon">🎬</div>
                    <div class="format-name">No Watermark</div>
                    <div class="format-desc">MP4 · Tanpa logo</div>
                    <div class="badge">Recommended</div>
                </div>
                <div class="format-card" data-format="mp3">
                    <div class="format-icon">🎵</div>
                    <div class="format-name">MP3 Audio</div>
                    <div class="format-desc">Audio saja</div>
                </div>
            </div>
        </div>

        <!-- URL Input -->
        <div class="url-section">
            <label class="url-label">PASTE URL TIKTOK:</label>
            <div class="input-wrapper">
                <i class="fas fa-link"></i>
                <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/ZS9YBwrrWW/">
            </div>
        </div>

        <!-- Tombol Ambil -->
        <button class="btn-download" id="downloadBtn">
            <i class="fas fa-download"></i> AMBIL
        </button>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Memproses link TikTok...</p>
        </div>

        <!-- Result Container -->
        <div id="result" class="hidden"></div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 TikTok Downloader | No Watermark | Free Forever</p>
        </div>
    </div>

    <script>
        // DOM Elements
        const formatCards = document.querySelectorAll('.format-card');
        const urlInput = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');

        let selectedFormat = 'video';

        // Format selection
        formatCards.forEach(card => {
            card.addEventListener('click', () => {
                formatCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedFormat = card.dataset.format;
                // Clear previous result
                resultDiv.classList.add('hidden');
                resultDiv.innerHTML = '';
            });
        });

        // Download function
        async function handleDownload() {
            const url = urlInput.value.trim();
            
            if (!url) {
                showError('❌ Masukkan link TikTok terlebih dahulu!');
                return;
            }

            // Validate TikTok URL
            if (!url.includes('tiktok.com') && !url.includes('vt.tiktok')) {
                showError('❌ URL tidak valid! Pastikan link dari TikTok.');
                return;
            }

            // UI State
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Memproses...';
            loadingDiv.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        type: selectedFormat
                    })
                });

                const data = await response.json();
                console.log('Response:', data);

                if (data.success) {
                    showResult(data);
                } else {
                    showError(data.error || 'Gagal memproses link. Coba lagi nanti.');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Terjadi kesalahan. Pastikan server backend berjalan.');
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<i class="fas fa-download"></i> AMBIL';
                loadingDiv.classList.add('hidden');
            }
        }

        function showResult(data) {
            const isVideo = selectedFormat === 'video';
            const icon = isVideo ? '📹' : '🎵';
            const fileType = isVideo ? 'MP4 Video' : 'MP3 Audio';
            const buttonIcon = isVideo ? '<i class="fas fa-download"></i>' : '<i class="fas fa-headphones"></i>';
            const buttonText = isVideo ? 'Download Video (No Watermark)' : 'Download MP3 Audio';
            
            resultDiv.innerHTML = `
                <div class="result">
                    <div class="result-content">
                        ${data.cover ? `
                        <div class="result-thumb">
                            <img src="${data.cover}" alt="thumbnail" onerror="this.style.display='none'">
                        </div>
                        ` : ''}
                        <div class="result-info">
                            <div class="result-title">${icon} ${escapeHtml(data.title).substring(0, 80)}</div>
                            <div class="result-author"><i class="fab fa-tiktok"></i> @${escapeHtml(data.author)}</div>
                            <div class="result-meta">📁 ${fileType} ${data.duration && data.duration !== '0' ? `· ⏱️ ${data.duration} detik` : ''}</div>
                            <a href="${data.downloadUrl}" class="download-btn" download target="_blank" rel="noopener noreferrer">
                                ${buttonIcon} ${buttonText}
                            </a>
                        </div>
                    </div>
                </div>
            `;
            resultDiv.classList.remove('hidden');
        }

        function showError(msg) {
            resultDiv.innerHTML = `
                <div class="error">
                    <i class="fas fa-exclamation-circle"></i> ${escapeHtml(msg)}
                </div>
            `;
            resultDiv.classList.remove('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Event listeners
        downloadBtn.addEventListener('click', handleDownload);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleDownload();
        });

        // Auto-fill example (optional)
        urlInput.value = 'https://vt.tiktok.com/ZS9YBwrrWW/';
    </script>
</body>
</html>
